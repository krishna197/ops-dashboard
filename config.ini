# ============================================================
#  Operations Dashboard - settings.  Edit, save, restart start.bat
#  Lines starting with # are comments. Do not use ; inside values.
# ============================================================
[app]
title = Operations Dashboard
excel_file = Data.xlsx          ; your workbook (same folder, or a full path / shared-drive path)
host = 0.0.0.0                  ; 0.0.0.0 = teammates can open it; localhost = only you
port = 8000
refresh_seconds = 30            ; how often browsers check for a new Excel save
open_browser = yes
theme = dark                    ; dark or light (users can toggle with the ◐ button)

[sheets]
# A sheet is found if its name CONTAINS this text (not case sensitive).
overall = overall
database = database overview
vertical = vertical overview
standardization = standardization overview
kpi = kpi trend

[overview]
# Metrics shown as headline cards on the Overview tab (regex, comma separated).
headline = ^clients$, ^databases$, quality escape

[rules]
# Metrics matching this are "lower is better" (a rise shows red, not green).
lower_is_better = red|amber|drop|missed|not included|attrition|escape|cycle|non-
good_score = 90                 ; compliance % at or above = green
warn_score = 70                 ; at or above = amber, below = red

# ------------------------------------------------------------
#  TABS.  Each [group:name] becomes a sidebar tab, in this order.
#  match  = regex on the metric names in the "Overall" sheet
#  chartN = Title => stacked|grouped => metric regexes => colours
#  To add a tab: copy a block, change the name and match. That's it.
# ------------------------------------------------------------
[group:health]
title = Database health
icon = ◉
section = Operations
match = ^(clients|databases|db health)
chart1 = Database health by month => stacked => red, amber, green => #ef4444, #f59e0b, #22c55e

[group:change]
title = Changes & UPCs
icon = ⇄
section = Operations
match = upc|value change|not included|missed obs

[group:service]
title = Client service
icon = ✉
section = Operations
match = change req|client inqu
chart1 = Change requests => grouped => change req.*rec, change req.*impl => #60a5fa, #22c55e
chart2 = Client inquiries => grouped => inqu.*rec, inqu.*resp => #60a5fa, #22c55e

[group:speed]
title = Speed & quality
icon = ⚡
section = Operations
match = cycle|say do|quality escape|mid cy

[group:team]
title = Team
icon = ☺
section = People & process
match = team size|available size|attrition|joinee|saviom|new build
